spring:
  application:
    name: property-view
  datasource:
    url: jdbc:h2:mem:hotels;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

server:
  port: 8092
  servlet:
    context-path: /property-view