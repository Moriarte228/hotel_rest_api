databaseChangeLog:
  - changeSet:
      id: 001-create-hotels
      author: tatsiana
      changes:
        - createTable:
            tableName: hotels
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true } }
              - column: { name: name, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(2000) }
              - column: { name: brand, type: VARCHAR(255) }
              - column: { name: house_number, type: INT }
              - column: { name: street, type: VARCHAR(255) }
              - column: { name: city, type: VARCHAR(255) }
              - column: { name: country, type: VARCHAR(255) }
              - column: { name: post_code, type: VARCHAR(20) }
              - column: { name: phone, type: VARCHAR(50) }
              - column: { name: email, type: VARCHAR(255) }
              - column: { name: check_in, type: TIME }
              - column: { name: check_out, type: TIME }

  - changeSet:
      id: 002-create-hotel-amenities
      author: tatsiana
      changes:
        - createTable:
            tableName: hotel_amenities
            columns:
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_hotel_amenities_hotel
                    references: hotels(id)
                    deleteCascade: true
              - column: { name: amenity_order, type: INT, constraints: { nullable: false } }
              - column: { name: amenity, type: VARCHAR(255), constraints: { nullable: false } }
        - addPrimaryKey:
            tableName: hotel_amenities
            columnNames: hotel_id, amenity_order